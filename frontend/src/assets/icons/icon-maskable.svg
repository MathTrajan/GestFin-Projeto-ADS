<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- full-bleed para a zona de segurança do maskable (o SO aplica a própria máscara) -->
  <rect width="32" height="32" fill="#1E3A8A"/>
  <!-- logo reduzido ao centro (~72%) para caber na safe zone -->
  <g transform="translate(16 16) scale(0.72) translate(-16 -16)">
    <rect x="7"  y="17" width="4" height="8"  rx="1" fill="#93C5FD"/>
    <rect x="14" y="12" width="4" height="13" rx="1" fill="#BFDBFE"/>
    <rect x="21" y="7"  width="4" height="18" rx="1" fill="#FFFFFF"/>
  </g>
</svg>
